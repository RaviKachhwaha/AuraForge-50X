; ==============================================================================
; AuraForge 50X - PlatformIO Configuration
; Board: ESP32-WROOM-32E (240MHz Dual-Core, 4MB Flash)
; ==============================================================================

[env:auraforge_50x]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; Memory & Partition Settings (Expanded Flash Partition for BT + WiFi Stacks)
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Compiler Optimizations for Real-Time DSP Audio Processing
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -O3
    -ffast-math
    -DAURAFORGE_VERSION=\"1.0.0\"

; Library Dependencies
lib_deps = 
    https://github.com/pschatzmann/ESP32-A2DP.git
    bblanchon/ArduinoJson @ ^6.21.3