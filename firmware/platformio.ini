; ==============================================================================
; AuraForge 50X - PlatformIO Configuration
; Target Hardware: ESP32-WROOM-32E (240MHz Dual-Core, 4MB Flash)
; Platform: 4-Layer KiCad 10 | TPA3116D2 50W Class-D + TPS61088 10A Boost
; ==============================================================================

[env:auraforge_50x]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; Memory & Partition Settings (3MB Flash Partition for BT + WiFi + DSP Stacks)
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L

; Compiler Configuration
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DAURAFORGE_VERSION=\"1.0.0\"

; Library Dependencies
lib_deps = 
    https://github.com/pschatzmann/ESP32-A2DP.git
    bblanchon/ArduinoJson @ ^6.21.3
    me-no-dev/AsyncTCP @ ^1.1.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git